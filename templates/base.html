<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ALTS Wealth Watch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">ALTS Wealth Watch</a>
      {% if session.get('user_id') %}
        <div>
          <span class="text-white me-3">{{ session['name'] }}</span>
          {% if session.get('role') == 'admin' %}
            <a href="{{ url_for('review_queue') }}" class="btn btn-sm btn-outline-light me-2">Review queue</a>
            <a href="{{ url_for('upload_officials') }}" class="btn btn-sm btn-outline-light me-2">Register officials</a>
          {% else %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
          {% endif %}
          <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Log out</a>
        </div>
      {% endif %}
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
